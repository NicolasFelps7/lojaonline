<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Prime Vision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <img src="img/primevision.png" class="logo">
</header>

<main class="login-wrapper">

  <div class="login-columns">

    <!-- LOGIN -->
    <section class="column">
      <h3>Já sou cliente</h3>

      <input type="text" id="loginEmail" placeholder="E-mail">
      <input type="password" id="loginSenha" placeholder="Senha">

      <button class="btn-primary" onclick="login()">Acessar conta</button>
    </section>

    <div class="divider"></div>

    <!-- CADASTRO -->
    <section class="column">
      <h3>Criar conta</h3>

      <input type="text" id="cadNome" placeholder="Nome">
      <input type="text" id="cadEmail" placeholder="E-mail">
      <input type="password" id="cadSenha" placeholder="Senha">

      <button class="btn-primary" onclick="criarConta()">Criar conta</button>
    </section>

  </div>

</main>

<script src="script.js"></script>
</body>
</html>
